services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-db
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
      POSTGRES_DB: darukaa
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darukaa']
      interval: 5s
      retries: 5

volumes:
  pgdata:
